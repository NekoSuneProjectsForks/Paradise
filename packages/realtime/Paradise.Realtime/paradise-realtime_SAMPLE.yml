MasterHostname: '127.0.0.1'

WebServicePort: 8080
FileServerPort: 8081
SocketPort: 8082

WebServiceEndpoint: '/2.0'
WebServicePrefix: 'UberStrike.DataCenter.WebService.CWS.'
WebServiceSuffix: 'Contract.svc'
WebServiceUseTLS: false

CommApplicationSettings:
  ApplicationIdentifier: '00000000-0000-0000-0000-000000000000' # Add GUID here
  PhotonId: 0
  EncryptionPassPhrase: 'paradise-secret-comm' # Add passphrase here
  MaxPlayerCount: 100

GameApplicationSettings:
  ApplicationIdentifier: '11111111-1111-1111-1111-111111111111' # Add GUID here
  PhotonId: 1
  EncryptionPassPhrase: 'paradise-secret-game' # Add passphrase here
  MaxPlayerCount: 100

EnableChatLog: true

HeartbeatInterval: 5
HeartbeatTimeout: 5
EnableHashVerification: false

CompositeHashes:
  -

JunkHashes:
  -

GameplaySettings:
  TickRate: 64
  MatchCountdownTime: 5
  PlayerRespawnTime: 5
  AllowFriendlyFire: false
  MatchEndTimeout: 3
  MinimumPlayerCount:
    DeathMatch: 2
    TeamDeathMatch: 1
    TeamElimination: 1